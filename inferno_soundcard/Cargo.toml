[package]
name = "inferno_soundcard"
description = "Windows virtual sound cards on the Dante network: USB audio devices served over USB/IP (usbip-win2)"
authors = ["Teo <teodly@lumifaza.org>"]
license = "GPL-3.0-or-later OR AGPL-3.0-or-later"
version = "0.1.0"
edition = "2021"

[dependencies]
inferno_aoip = { path = "../inferno_aoip" }
inferno_driver_core = { path = "../inferno_driver_core" }
usbip-audio = { git = "https://github.com/network-audio/usbip-audio", rev = "bd68b8d738723d0e1d4eb719a9fac44699dd1eca" }
env_logger = "0.11"
log = "0.4.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }
