# PipeWire nodes for the Inferno virtual soundcard: a sink (to the Dante network) and a source (from it).
# Install as ~/.config/pipewire/pipewire.conf.d/50-inferno.conf (or /etc/pipewire/pipewire.conf.d/) and
# restart PipeWire. Channel counts and other settings come from the ALSA config (pcm.inferno) or INFERNO_*
# environment variables of the PipeWire service; long api.alsa.path strings don't work in PipeWire.
#
# Inferno needs the media clock: a PTP daemon (Statime) must be running, see the README.

context.objects = [
    {   factory = adapter
        args = {
            factory.name                 = api.alsa.pcm.sink
            node.name                    = "inferno_sink"
            node.description             = "Inferno (Dante) output"
            media.class                  = "Audio/Sink"
            api.alsa.path                = "inferno"
            api.alsa.headroom            = 128
            # a dummy card number: PipeWire would otherwise look for an ALSA card of this device
            api.alsa.pcm.card            = 999
            audio.rate                   = 48000
            # keep the stream running: Dante receivers expect a continuous flow
            session.suspend-timeout-seconds = 0
            node.pause-on-idle           = false
            node.suspend-on-idle         = false
            node.always-process          = true
            object.linger                = true
        }
    }
    {   factory = adapter
        args = {
            factory.name                 = api.alsa.pcm.source
            node.name                    = "inferno_source"
            node.description             = "Inferno (Dante) input"
            media.class                  = "Audio/Source"
            api.alsa.path                = "inferno"
            api.alsa.headroom            = 128
            api.alsa.pcm.card            = 999
            audio.rate                   = 48000
            session.suspend-timeout-seconds = 0
            node.pause-on-idle           = false
            node.suspend-on-idle         = false
            node.always-process          = true
            object.linger                = true
        }
    }
]
