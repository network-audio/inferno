version: "3.8"

# All configs and scripts in this test suite are dedicated to the public domain.
# Feel free to adapt for your software without giving attribution.

volumes:
  shared:

services:
  init:
    image: alpine:3.22
    volumes:
      - shared:/shared
    command: ["/bin/sh", "-c", "rm -rf /shared/* ; true"]

  clock_source:
    build: fake_usrvclock_server
    environment:
      - USRVCLOCK_SOCKET=/shared/usrvclock
    volumes:
      - shared:/shared
    depends_on:
      init:
        condition: service_completed_successfully
      #control_and_test:
      #  condition: service_started

  jack1:
    build: alpine_jack
    env_file: inferno.env
    environment:
      - INFERNO_NAME=jack1
      - INFERNO_RX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
      - INFERNO_TX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
    cap_add:
      - SYS_NICE # realtime priority
    networks:
      - audio_net
    volumes:
      - shared:/shared
    ulimits:
      memlock: 200000000
      rtprio: 99 # Inferno's flows threads run with realtime priority
    shm_size: 200m
    depends_on:
      init:
        condition: service_completed_successfully
      clock_source:
        condition: service_started

  jack2:
    build: debian_jack
    platform: ${DEBIAN_PLATFORM:-}
    env_file: inferno.env
    environment:
      - INFERNO_NAME=jack2
      - INFERNO_RX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
      - INFERNO_TX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
    cap_add:
      - SYS_NICE # realtime priority
    networks:
      - audio_net
    volumes:
      - shared:/shared
    ulimits:
      memlock: 200000000
      rtprio: 99 # Inferno's flows threads run with realtime priority
    shm_size: 200m
    depends_on:
      init:
        condition: service_completed_successfully
      clock_source:
        condition: service_started

  aplayrec1:
    build: alpine_aplay_arecord
    env_file: inferno.env
    environment:
      - INFERNO_NAME=aplayrec1
      - INFERNO_RX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
      - INFERNO_TX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
      # second address for the capture device, outside audio_net's dynamic ip_range
      - CAPTURE_IP=${AUDIO_NET_PREFIX:-10.213.77}.201/24
    cap_add:
      - NET_ADMIN # to add CAPTURE_IP
      - SYS_NICE # realtime priority
    networks:
      - audio_net
    volumes:
      - shared:/shared
    ulimits:
      memlock: 200000000
      rtprio: 99 # Inferno's flows threads run with realtime priority
    shm_size: 200m
    depends_on:
      init:
        condition: service_completed_successfully
      clock_source:
        condition: service_started

  aplayrec2:
    build: alpine_aplay_arecord
    env_file: inferno.env
    environment:
      - INFERNO_NAME=aplayrec2
      - INFERNO_RX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
      - INFERNO_TX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
      # second address for the capture device, outside audio_net's dynamic ip_range
      - CAPTURE_IP=${AUDIO_NET_PREFIX:-10.213.77}.202/24
    cap_add:
      - NET_ADMIN # to add CAPTURE_IP
      - SYS_NICE # realtime priority
    networks:
      - audio_net
    volumes:
      - shared:/shared
    ulimits:
      memlock: 200000000
      rtprio: 99 # Inferno's flows threads run with realtime priority
    shm_size: 200m
    depends_on:
      init:
        condition: service_completed_successfully
      clock_source:
        condition: service_started

  # PENDING: two Inferno devices sharing one IP (aplayrec3p and aplayrec3c, no CAPTURE_IP).
  # netaudio 0.4 keys devices by IP (see README), so this only runs with INFERNO_TEST_SAME_HOST_DEVICES=1
  # (run_test.sh then enables the same_host profile).
  aplayrec3:
    build: alpine_aplay_arecord
    profiles: [same_host]
    env_file: inferno.env
    environment:
      - INFERNO_NAME=aplayrec3
      - INFERNO_RX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
      - INFERNO_TX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
    cap_add:
      - SYS_NICE # realtime priority
    networks:
      - audio_net
    volumes:
      - shared:/shared
    ulimits:
      memlock: 200000000
      rtprio: 99 # Inferno's flows threads run with realtime priority
    shm_size: 200m
    depends_on:
      init:
        condition: service_completed_successfully
      clock_source:
        condition: service_started

  pipewire1:
    build: fedora_pipewire
    env_file: inferno.env
    environment:
      - INFERNO_NAME=pipewire1
      - INFERNO_RX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
      - INFERNO_TX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
    cap_add:
      - SYS_NICE # realtime priority
    networks:
      - audio_net
    volumes:
      - shared:/shared
    ulimits:
      memlock: 200000000
      rtprio: 99 # Inferno's flows threads run with realtime priority
    shm_size: 200m
    depends_on:
      init:
        condition: service_completed_successfully
      clock_source:
        condition: service_started

  i2pipe1:
    build: alpine_i2pipe
    env_file: inferno.env
    environment:
      - INFERNO_NAME=i2pipe1
      - INFERNO_RX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
      - INFERNO_TX_LATENCY_NS=${INFERNO_TEST_LATENCY_NS:-40000000}
    networks:
      - audio_net
    volumes:
      - shared:/shared
    cap_add:
      - SYS_NICE # realtime priority
    ulimits:
      rtprio: 99 # Inferno's flows threads run with realtime priority
    depends_on:
      init:
        condition: service_completed_successfully
      clock_source:
        condition: service_started

  control_and_test:
    build: control_and_test
    env_file: inferno.env
    environment:
      - INFERNO_TEST_SAME_HOST_DEVICES=${INFERNO_TEST_SAME_HOST_DEVICES:-0}
    networks:
      - audio_net
    volumes:
      - shared:/shared
    depends_on:
      jack1:
        condition: service_started
      jack2:
        condition: service_started
      aplayrec1:
        condition: service_started
      aplayrec2:
        condition: service_started
      aplayrec3:
        condition: service_started
        required: false # only in the same_host profile

networks:
  audio_net:
    driver: bridge
    ipam:
      config:
        # fixed subnet so aplayrec containers can add a second address (CAPTURE_IP) that Docker never
        # hands out: dynamic addresses come from the lower half only. Override the prefix if it clashes.
        - subnet: ${AUDIO_NET_PREFIX:-10.213.77}.0/24
          ip_range: ${AUDIO_NET_PREFIX:-10.213.77}.0/25
