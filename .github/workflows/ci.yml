name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install --assume-yes libasound2-dev
      - run: cargo build --workspace --all-targets
      # The ALSA plugin's DAW tests are timing-sensitive: run serially.
      # searchfire's own test needs mDNS multicast on the host network.
      - run: cargo test --workspace --exclude searchfire -- --test-threads=1

  docker-suite:
    # test/dockerized_trx: Inferno in ALSA (Alpine, Debian), JACK, PipeWire (Fedora) and Inferno2pipe
    # containers, two devices sharing an IP among them, routed with netaudio; recordings compared bit-exact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Docker test suite
        working-directory: test/dockerized_trx
        # amd64: GitHub's runners can't resolve names in the i386 Debian build (the default on x86 hosts)
        run: DEBIAN_PLATFORM=linux/amd64 ARTIFACTS_DIR=$PWD/artifacts ./run_test.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-suite
          path: test/dockerized_trx/artifacts

  portable:
    # the crates other drivers build on (the ALSA plugin and inferno-doctor are Linux-only)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p inferno_aoip -p inferno_driver_core -p inferno2pipe -p pipe2inferno -p asio_inferno -p inferno_soundcard -p inferno_soundcard_shm -p inferno_coreaudio --all-targets --examples
      - run: cargo test --no-fail-fast -p inferno_aoip -p inferno_driver_core -p asio_inferno -p inferno_soundcard -p inferno_soundcard_shm -p inferno_coreaudio -- --test-threads=1
