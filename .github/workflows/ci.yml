name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install --assume-yes libasound2-dev
      - run: cargo build --workspace --all-targets
      # The ALSA plugin's DAW tests are timing-sensitive: run serially.
      # searchfire's own test needs mDNS multicast on the host network.
      - run: cargo test --workspace --exclude searchfire -- --test-threads=1

  portable:
    # the crates other drivers build on (the ALSA plugin and inferno-doctor are Linux-only)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p inferno_aoip -p inferno_driver_core -p inferno2pipe -p pipe2inferno -p asio_inferno --all-targets --examples
      - run: cargo test --no-fail-fast -p inferno_aoip -p inferno_driver_core -p asio_inferno -- --test-threads=1
