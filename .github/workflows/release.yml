name: Release

# Windows and macOS installers of the virtual sound cards: built and smoke-tested on every run, published as
# assets of the release of a pushed v* tag (or of an existing tag, run by hand).
on:
  push:
    tags: ['v*']
    branches: [dev, windows-e2e]
    paths: ['packaging/**', 'inferno_soundcard/**', 'inferno_soundcard_shm/**', 'inferno_coreaudio/**', '.github/workflows/release.yml']
  pull_request:
    paths: ['packaging/**', 'inferno_soundcard/**', 'inferno_soundcard_shm/**', 'inferno_coreaudio/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish the installers for (empty to only build them)
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  USBIP_VERSION: 0.9.8.1

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-2025, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p inferno_soundcard
      - uses: actions/upload-artifact@v4
        with:
          name: inferno-soundcard-${{ matrix.arch }}
          path: target/release/inferno_soundcard.exe
          if-no-files-found: error

  installer:
    needs: build
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inferno-soundcard-${{ matrix.arch }}
          path: staging
      - name: Stage files and compile the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.arch }}'
          $tag = '${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}'
          $version = if ($tag -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else {
            (Select-String -Path inferno_soundcard/Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          }
          "version $version"
          $upstream = "staging/USBip-$env:USBIP_VERSION-$arch.exe"
          Invoke-WebRequest -Uri "https://github.com/vadimgrn/usbip-win2/releases/download/v.$env:USBIP_VERSION/USBip-$env:USBIP_VERSION-$arch.exe" -OutFile $upstream
          $expected = if ($arch -eq 'x64') { '38cad6d4432b52d5bb9409d9ad03b72fdffc4ada4cd3a48fbeca1a2752a8518a' } else { 'cab7ff97f79275eeb5c5b8bb2eb3111ff6b6c4eead07d9bec9be5bd1e3a35800' }
          $actual = (Get-FileHash -Algorithm SHA256 $upstream).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "usbip-win2 release checksum mismatch: $actual" }
          Copy-Item packaging/windows/*.ps1, packaging/windows/USBIP-LICENSE.txt staging/
          Copy-Item LICENSE staging/LICENSE.txt
          $nsis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $nsis) {
            # NSIS's own release, pinned: Chocolatey's package feed fails now and then
            $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
            foreach ($attempt in 1..3) {
              curl.exe -sSfL --retry 3 -o $zip 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip'
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 10
            }
            $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
            if ($actual -ne 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1') { throw "NSIS checksum mismatch: $actual" }
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
            $nsis = Join-Path $env:RUNNER_TEMP 'nsis-3.11\makensis.exe'
          }
          & $nsis "/DDIST_DIR=$((Resolve-Path staging).Path)" "/DUSBIP_ARCH=$arch" "/DVERSION=$version" "/DOUT_FILE=$((Get-Location).Path)\inferno-soundcard-windows-$arch-setup.exe" packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: inferno-soundcard-installer-${{ matrix.arch }}
          path: inferno-soundcard-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  smoke-test:
    # installs, checks the service starts (its settings page answers), uninstalls
    needs: installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inferno-soundcard-installer-${{ matrix.arch }}
      - name: Install, check, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path inferno-soundcard-windows-${{ matrix.arch }}-setup.exe).Path
          $result = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru
          if (-not $result.WaitForExit(240000)) { throw 'the installer did not finish within four minutes' }
          if ($result.ExitCode -ne 0) {
            Get-Content (Join-Path $env:TEMP 'inferno-soundcard-setup.log') -Tail 80 -ErrorAction SilentlyContinue
            throw "the installer exited with $($result.ExitCode)"
          }
          $folder = Join-Path $env:ProgramFiles 'Inferno Sound Cards'
          $usbip = [System.IO.File]::ReadAllText((Join-Path $folder 'usbip-path.txt')).Trim()
          if (-not (Test-Path -LiteralPath $usbip -PathType Leaf)) { throw "usbip.exe missing: $usbip" }
          $task = Get-ScheduledTask -TaskName 'Inferno Sound Cards'
          if ($task.Actions.Arguments -notmatch '-WindowStyle Hidden') { throw 'the service task is not hidden' }
          $status = $null
          for ($i = 0; $i -lt 60 -and -not $status; $i++) {
            try { $status = Invoke-RestMethod http://127.0.0.1:47800/api/status } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $status) {
            Get-Content (Join-Path $env:LOCALAPPDATA 'Inferno\soundcard.log') -Tail 50 -ErrorAction SilentlyContinue
            throw 'the service did not start: its settings page does not answer'
          }
          "service: $($status.state)"
          $page = Invoke-WebRequest http://127.0.0.1:47800/ -UseBasicParsing
          if ($page.Content -notmatch 'Inferno Sound Cards') { throw 'the settings page is missing' }
          $result = Start-Process -FilePath (Join-Path $folder 'Uninstall.exe') -ArgumentList '/S', "_?=$folder" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "the uninstaller exited with $($result.ExitCode)" }
          if (Get-ScheduledTask -TaskName 'Inferno Sound Cards' -ErrorAction SilentlyContinue) { throw 'the service task remained' }
          if (Get-Process inferno_soundcard -ErrorAction SilentlyContinue) { throw 'the service is still running' }
          if (-not (Test-Path -LiteralPath $usbip)) { throw 'usbip-win2 was removed, other applications may need it' }
          'installed, started, uninstalled'

  macos:
    # a universal package (Apple silicon and Intel): built, signed and notarized (with the repository's Developer
    # ID secrets, if it has them), installed (the service starts, Core Audio loads the plug-in and lists the
    # default card), uninstalled
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      SIGNED: ${{ secrets.MACOS_CERTIFICATES_P12 != '' }}
      PUBLISHING: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Import the Developer ID identities
        if: env.SIGNED == 'true'
        env:
          CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          # a keychain of this job only, deleted at its end
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$CERTIFICATES_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productsign
          rm "$RUNNER_TEMP/certificates.p12"
          # Apple's Developer ID intermediate certificates, for the chains
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -sSfL --retry 3 -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity() {
            security find-identity -v "$keychain" | sed -n "s/.*\"\($1: .*\)\"/\1/p" | head -n 1
          }
          application=$(identity 'Developer ID Application')
          installer=$(identity 'Developer ID Installer')
          [ -n "$application" ] || { echo "::error::no Developer ID Application identity in MACOS_CERTIFICATES_P12"; exit 1; }
          [ -n "$installer" ] || { echo "::error::no Developer ID Installer identity in MACOS_CERTIFICATES_P12"; exit 1; }
          echo "signing with $application, $installer"
          echo "CODESIGN_IDENTITY=$application" >> "$GITHUB_ENV"
          echo "PKG_SIGN_IDENTITY=$installer" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          umask 077
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
      - name: Releases are signed
        if: env.SIGNED != 'true' && env.PUBLISHING == 'true'
        run: |
          echo "::error::the repository has no MACOS_CERTIFICATES_P12 secret: a release's package must be signed and notarized"
          exit 1
      - name: Build the package
        run: |
          tag='${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}'
          version=$([[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] && echo "${BASH_REMATCH[1]}" || true)
          packaging/macos/build-pkg.sh --universal ${version:+--version "$version"} --out inferno-soundcard-macos.pkg
          pkgutil --payload-files inferno-soundcard-macos.pkg
          pkgutil --expand-full inferno-soundcard-macos.pkg expanded
          for binary in "Library/Audio/Plug-Ins/HAL/Inferno.driver/Contents/MacOS/Inferno" "Library/Application Support/Inferno/bin/inferno_soundcard"; do
            lipo -archs "expanded/Payload/$binary" | grep -q 'x86_64 arm64' || { echo "::error::$binary isn't universal"; exit 1; }
          done
      - name: Notarize the package
        if: env.SIGNED == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for bundle in "Library/Audio/Plug-Ins/HAL/Inferno.driver" "Library/Application Support/Inferno/bin/inferno_soundcard" \
            "Applications/Inferno Sound Cards.app"; do
            codesign --verify --strict --verbose=2 "expanded/Payload/$bundle"
            codesign -dvv "expanded/Payload/$bundle" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|Runtime)'
          done
          pkgutil --check-signature inferno-soundcard-macos.pkg
          xcrun notarytool submit inferno-soundcard-macos.pkg --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m --output-format json | tee notarization.json || true
          id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' notarization.json)
          xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' notarization.json)
          [ "$status" = Accepted ] || { echo "::error::notarization: $status"; exit 1; }
          xcrun stapler staple inferno-soundcard-macos.pkg
          xcrun stapler validate inferno-soundcard-macos.pkg
          spctl --assess --type install --verbose=4 inferno-soundcard-macos.pkg 2>&1 | tee gatekeeper.txt
          grep -q 'source=Notarized Developer ID' gatekeeper.txt || { echo "::error::Gatekeeper doesn't accept the package"; exit 1; }
      - name: Install, check, uninstall
        run: |
          sudo installer -pkg inferno-soundcard-macos.pkg -target /
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:47800/api/status && break
            sleep 1
          done
          echo
          curl -sf http://127.0.0.1:47800/ | grep -q 'Mac sound devices' || { echo "::error::the settings page is missing"; exit 1; }
          cargo build -p inferno_coreaudio --example coreaudio_host
          for attempt in $(seq 1 45); do
            target/debug/examples/coreaudio_host --list | tee devices.txt
            grep -q '"Inferno"' devices.txt && break
            sleep 2
          done
          grep -q '"Inferno"' devices.txt || { cat /Library/Logs/Inferno/soundcard.log; echo "::error::the card didn't appear"; exit 1; }
          sudo "/Library/Application Support/Inferno/uninstall.sh"
          if launchctl print system/org.network-audio.inferno.soundcard >/dev/null 2>&1; then echo "::error::the service remained"; exit 1; fi
          if [ -e /Library/Audio/Plug-Ins/HAL/Inferno.driver ]; then echo "::error::the plug-in remained"; exit 1; fi
          echo 'installed, started, uninstalled'
      - name: Delete the signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"; rm -f "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: inferno-soundcard-installer-macos
          path: inferno-soundcard-macos.pkg
          if-no-files-found: error

  publish:
    needs: [smoke-test, macos]
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: inferno-soundcard-installer-*
          merge-multiple: true
          path: installers
      - name: Publish the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          ls -l installers
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" installers/*.exe installers/*.pkg --clobber
          else
            gh release create "$TAG" installers/*.exe installers/*.pkg --verify-tag --title "Inferno $TAG" --notes-file packaging/windows/RELEASE.md
          fi
