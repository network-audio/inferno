name: Windows end-to-end

on:
  push:
    branches: [dev, windows-e2e]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # netaudio prints characters the Windows console code page doesn't have
  PYTHONUTF8: "1"

jobs:
  e2e:
    # Inferno devices on one Windows host, routed with netaudio (see test/windows_e2e):
    # pipe: Pipe2inferno -> Inferno2pipe; asio: Pipe2inferno -> ASIO driver -> Inferno2pipe;
    # soundcard: Pipe2inferno -> virtual sound card (usbip-win2) -> WASAPI application -> Inferno2pipe
    strategy:
      fail-fast: false
      matrix:
        # netaudio 0.4 keys devices by IP: give each device its own on a loopback adapter, or let them share
        # the runner's (netaudio then lists and subscribes them, but skips their status probes). The runner's
        # own adapter mustn't be changed: that cuts the runner off.
        network: [loopback-adapter, shared-ip]
        scenario: [pipe, asio, soundcard]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - shell: bash
        run: |
          cargo build -p pipe2inferno -p inferno2pipe -p asio_inferno -p inferno_soundcard
          cargo build -p inferno_aoip --example ptpv1_test_leader
          cargo build -p asio_inferno --example asio_host
          cargo build -p inferno_soundcard --example wasapi_host
      - run: pip install netaudio
      - name: Install usbip-win2, allow recording
        if: matrix.scenario == 'soundcard'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "USBip-0.9.8.1-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/vadimgrn/usbip-win2/releases/download/v.0.9.8.1/$installer" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne '38cad6d4432b52d5bb9409d9ad03b72fdffc4ada4cd3a48fbeca1a2752a8518a') { throw "checksum mismatch: $actual" }
          $setup = Start-Process -FilePath ".\$installer" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/COMPONENTS=main,client' -Wait -PassThru
          if ($setup.ExitCode -notin @(0, 3010)) { throw "usbip-win2 setup returned $($setup.ExitCode)" }
          foreach ($root in 'HKLM:', 'HKCU:') {
            foreach ($key in 'microphone', 'microphone\NonPackaged') {
              $path = "$root\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\$key"
              New-Item -Path $path -Force | Out-Null
              Set-ItemProperty -Path $path -Name Value -Value Allow
            }
          }
      - name: Device addresses
        timeout-minutes: 5
        shell: pwsh
        run: |
          if ("${{ matrix.network }}" -eq "loopback-adapter") {
            # the package download fails now and then
            $devcon = $null
            foreach ($attempt in 1..3) {
              choco install devcon.portable --yes --no-progress --force | Out-Null
              $devcon = Get-ChildItem "$env:ChocolateyInstall\lib\devcon.portable" -Recurse -Filter "devcon*64*.exe" `
                -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($devcon) { break }
              "devcon not installed (attempt $attempt)"
              Start-Sleep -Seconds 10
            }
            if (-not $devcon) { throw "devcon (Chocolatey devcon.portable) couldn't be installed" }
            "devcon: $($devcon.FullName)"
            & $devcon.FullName install "$env:windir\inf\netloop.inf" "*msloop"
            Start-Sleep -Seconds 5
            $adapter = Get-NetAdapter | Where-Object InterfaceDescription -like "*KM-TEST Loopback*" | Select-Object -First 1
            "adapter: $($adapter.Name) ($($adapter.InterfaceDescription)), index $($adapter.ifIndex)"
            $ips = @("10.213.77.1", "10.213.77.2", "10.213.77.3")
            foreach ($ip in $ips) {
              New-NetIPAddress -InterfaceIndex $adapter.ifIndex -IPAddress $ip -PrefixLength 24 -ErrorAction Stop | Out-Null
            }
            # usable once duplicate address detection is done and the adapter is up
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-NetIPAddress -InterfaceIndex $adapter.ifIndex -AddressFamily IPv4 |
                Where-Object { $_.IPAddress -in $ips -and $_.AddressState -eq "Preferred" }).Count -lt $ips.Count) {
              if ((Get-Date) -gt $deadline) { throw "addresses not usable" }
              Start-Sleep -Seconds 1
            }
            Get-NetAdapter -InterfaceIndex $adapter.ifIndex | Format-Table Name, Status, MediaConnectionState
          } else {
            $route = Get-NetRoute -DestinationPrefix 0.0.0.0/0 | Sort-Object RouteMetric | Select-Object -First 1
            $adapter = Get-NetAdapter -InterfaceIndex $route.ifIndex
            "adapter: $($adapter.Name) ($($adapter.InterfaceDescription)), index $($adapter.ifIndex)"
            $own = (Get-NetIPAddress -InterfaceIndex $adapter.ifIndex -AddressFamily IPv4 -AddressState Preferred |
              Select-Object -First 1).IPAddress
            $ips = @($own, $own, $own)
          }
          "IPS=$($ips -join ',')" >> $env:GITHUB_ENV
          Get-NetIPAddress -InterfaceIndex $adapter.ifIndex -AddressFamily IPv4 | Format-Table IPAddress, PrefixOrigin, AddressState
          Get-NetUDPEndpoint -LocalPort 5353 -ErrorAction SilentlyContinue | Format-Table LocalAddress, OwningProcess
      - timeout-minutes: 10
        run: python test/windows_e2e/run_e2e.py --scenario ${{ matrix.scenario }} --bin-dir target/debug --ips ${{ env.IPS }} --out-dir e2e-out
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-logs-${{ matrix.scenario }}-${{ matrix.network }}
          path: |
            e2e-out/*.log
            e2e-out/*recording.raw
