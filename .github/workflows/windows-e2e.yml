name: Windows end-to-end

on:
  push:
    branches: [dev, windows-e2e]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # netaudio prints characters the Windows console code page doesn't have
  PYTHONUTF8: "1"

jobs:
  pipe-to-pipe:
    # Pipe2inferno -> Inferno2pipe on one Windows host, routed with netaudio (see test/windows_e2e)
    strategy:
      fail-fast: false
      matrix:
        # netaudio 0.4 keys devices by IP: give each device its own on a loopback adapter, or let them share
        # the runner's (netaudio then lists and subscribes them, but skips their status probes). The runner's
        # own adapter mustn't be changed: that cuts the runner off.
        network: [loopback-adapter, shared-ip]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo build -p pipe2inferno -p inferno2pipe
      - run: pip install netaudio
      - name: Device addresses
        timeout-minutes: 5
        shell: pwsh
        run: |
          if ("${{ matrix.network }}" -eq "loopback-adapter") {
            choco install devcon.portable --yes --no-progress | Out-Null
            $devcon = Get-ChildItem "$env:ChocolateyInstall\lib\devcon.portable" -Recurse -Filter "devcon*64*.exe" |
              Select-Object -First 1
            "devcon: $($devcon.FullName)"
            & $devcon.FullName install "$env:windir\inf\netloop.inf" "*msloop"
            Start-Sleep -Seconds 5
            $adapter = Get-NetAdapter | Where-Object InterfaceDescription -like "*KM-TEST Loopback*" | Select-Object -First 1
            "adapter: $($adapter.Name) ($($adapter.InterfaceDescription)), index $($adapter.ifIndex)"
            $ips = @("10.213.77.1", "10.213.77.2")
            foreach ($ip in $ips) {
              New-NetIPAddress -InterfaceIndex $adapter.ifIndex -IPAddress $ip -PrefixLength 24 -ErrorAction Stop | Out-Null
            }
            # usable once duplicate address detection is done and the adapter is up
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-NetIPAddress -InterfaceIndex $adapter.ifIndex -AddressFamily IPv4 |
                Where-Object { $_.IPAddress -in $ips -and $_.AddressState -eq "Preferred" }).Count -lt 2) {
              if ((Get-Date) -gt $deadline) { throw "addresses not usable" }
              Start-Sleep -Seconds 1
            }
            Get-NetAdapter -InterfaceIndex $adapter.ifIndex | Format-Table Name, Status, MediaConnectionState
          } else {
            $route = Get-NetRoute -DestinationPrefix 0.0.0.0/0 | Sort-Object RouteMetric | Select-Object -First 1
            $adapter = Get-NetAdapter -InterfaceIndex $route.ifIndex
            "adapter: $($adapter.Name) ($($adapter.InterfaceDescription)), index $($adapter.ifIndex)"
            $own = (Get-NetIPAddress -InterfaceIndex $adapter.ifIndex -AddressFamily IPv4 -AddressState Preferred |
              Select-Object -First 1).IPAddress
            $ips = @($own, $own)
          }
          "TX_IP=$($ips[0])" >> $env:GITHUB_ENV
          "RX_IP=$($ips[1])" >> $env:GITHUB_ENV
          Get-NetIPAddress -InterfaceIndex $adapter.ifIndex -AddressFamily IPv4 | Format-Table IPAddress, PrefixOrigin, AddressState
          Get-NetUDPEndpoint -LocalPort 5353 -ErrorAction SilentlyContinue | Format-Table LocalAddress, OwningProcess
      - timeout-minutes: 10
        run: python test/windows_e2e/run_e2e.py --bin-dir target/debug --tx-ip ${{ env.TX_IP }} --rx-ip ${{ env.RX_IP }} --out-dir e2e-out
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-logs-${{ matrix.network }}
          path: e2e-out/*.log
