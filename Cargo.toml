[workspace]
resolver = "2"

members = [
    "inferno_aoip",
    "searchfire",
    "inferno2pipe",
    "pipe2inferno",
    "inferno_driver_core",
    "alsa_pcm_inferno",
    "asio_inferno",
    "inferno_soundcard",
    "inferno_soundcard_shm",
    "inferno_coreaudio",
    "inferno_doctor",
]

[workspace.metadata.cross.target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get --assume-yes install libasound-dev:$CROSS_DEB_ARCH"
]

